
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grah Pravesh | 29 November 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    color: #543817;
    font-family: 'Montserrat', sans-serif;

    background:
        radial-gradient(ellipse at 50% 45%, rgba(255,239,190,.85), transparent 55%),
        radial-gradient(ellipse at 10% 10%, #f5d998, transparent 48%),
        radial-gradient(ellipse at 90% 90%, #d8ae60, transparent 55%),
        linear-gradient(135deg, #dcb96f, #f2d99d, #c99b49, #edcf8d);
}

/* Satin-like golden background */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;

    background:
        repeating-linear-gradient(
            115deg,
            rgba(255,255,255,.07) 0px,
            rgba(255,255,255,.02) 3px,
            transparent 7px,
            rgba(125,81,24,.035) 12px
        ),
        linear-gradient(
            125deg,
            transparent 15%,
            rgba(255,248,215,.24) 35%,
            transparent 55%,
            rgba(130,83,22,.10) 75%,
            transparent 90%
        );

    opacity: .9;
}

/* Decorative golden frame */

.frame {
    position: fixed;
    inset: 17px;
    border: 1px solid rgba(125, 80, 25, .65);
    outline: 1px solid rgba(255, 239, 190, .55);
    outline-offset: 5px;
    pointer-events: none;
    z-index: 10;
}

.frame::before,
.frame::after {
    content: "✦";
    position: absolute;
    color: #8c6229;
    font-size: 23px;
}

.frame::before {
    top: -14px;
    left: -10px;
}

.frame::after {
    bottom: -14px;
    right: -10px;
}

.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 75px 20px;
}

/* Main content */

.top-label {
    font-size: 11px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #76501e;
    margin-bottom: 22px;
    font-weight: 600;
}

.small-divider {
    width: 105px;
    height: 1px;
    background: linear-gradient(to right, transparent, #80551e, transparent);
    margin: 0 auto 24px;
}

.script-title {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(38px, 6vw, 65px);
    color: #79501e;
    font-weight: 400;
    margin-bottom: 5px;
}

.main-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(48px, 9vw, 100px);
    line-height: .95;
    font-weight: 600;
    letter-spacing: 3px;
    color: #553719;
    text-shadow: 0 2px 1px rgba(255,255,255,.25);
}

.subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(19px, 3vw, 27px);
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #805a27;
    margin-top: 17px;
}

.gold-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    margin: 30px auto;
    color: #875b20;
    font-size: 15px;
}

.gold-divider::before,
.gold-divider::after {
    content: "";
    height: 1px;
    width: 65px;
    background: linear-gradient(to right, transparent, #936526);
}

.gold-divider::after {
    transform: rotate(180deg);
}

.invitation {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(19px, 3vw, 25px);
    line-height: 1.5;
    color: #62451f;
    letter-spacing: 1px;
}

.date {
    margin-top: 17px;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(25px, 4vw, 37px);
    font-weight: 600;
    color: #694719;
}

.venue {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #795627;
}

/* Countdown */

.countdown {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 38px;
    flex-wrap: wrap;
}

.time-box {
    width: 100px;
    padding: 16px 8px 13px;
    border: 1px solid rgba(120, 78, 27, .65);
    background: linear-gradient(
        145deg,
        rgba(255,236,184,.75),
        rgba(210,169,91,.45)
    );
    box-shadow:
        inset 0 1px 8px rgba(255,255,255,.4),
        0 5px 15px rgba(92,58,18,.12);
}

.time-box span {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 39px;
    font-weight: 600;
    color: #593a17;
    line-height: 1;
}

.time-box small {
    display: block;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #795322;
    margin-top: 9px;
}

.footer {
    margin-top: 38px;
    font-family: 'Great Vibes', cursive;
    font-size: 29px;
    color: #76501e;
}

/* Musicians - transparent cutouts */

.musician {
    position: absolute;
    width: clamp(190px, 24vw, 340px);
    height: auto;
    top: 50%;
    transform: translateY(-40%);
    object-fit: contain;
    z-index: 1;
    pointer-events: none;
    filter: drop-shadow(0 12px 12px rgba(75, 47, 16, .17));
}

.musician-left {
    left: 1.5%;
}

.musician-right {
    right: 1.5%;
    transform: translateY(-40%) scaleX(-1);
}

/* Responsive design */

@media (max-width: 900px) {
    .musician {
        width: 210px;
        opacity: .85;
    }

    .musician-left {
        left: -55px;
    }

    .musician-right {
        right: -55px;
    }
}

@media (max-width: 600px) {
    .container {
        padding: 90px 15px 65px;
        justify-content: center;
    }

    .musician {
        width: 135px;
        top: auto;
        bottom: 15px;
        opacity: .8;
    }

    .musician-left {
        left: -28px;
    }

    .musician-right {
        right: -28px;
    }

    .top-label {
        font-size: 9px;
        letter-spacing: 4px;
    }

    .subtitle {
        letter-spacing: 3px;
    }

    .countdown {
        gap: 9px;
        margin-top: 28px;
    }

    .time-box {
        width: 75px;
        padding: 13px 5px;
    }

    .time-box span {
        font-size: 30px;
    }

    .time-box small {
        font-size: 8px;
        letter-spacing: 1px;
    }

    .footer {
        margin-top: 28px;
        font-size: 24px;
    }

    .frame {
        inset: 11px;
    }
}

@media (max-width: 360px) {
    .time-box {
        width: 68px;
    }

    .countdown {
        gap: 7px;
    }
}
</style>
</head>

<body>

<div class="frame"></div>

<!-- Same musician image on both sides -->
<img src="shehnai.png" class="musician musician-left" alt="Shehnai musician">

<img src="shehnai.png" class="musician musician-right" alt="Shehnai musician">

<main class="container">

    <div class="top-label">A New Beginning • A New Journey</div>

    <div class="small-divider"></div>

    <div class="script-title">With Divine Blessings</div>

    <h1 class="main-title">GRAH PRAVESH</h1>

    <div class="subtitle">A Celebration of New Beginnings</div>

    <div class="gold-divider">✦</div>

    <p class="invitation">
        A beautiful new chapter is about to begin.<br>
        We look forward to celebrating this special occasion.
    </p>

    <div class="date">29 November 2026</div>

    <div class="venue">Hyderabad</div>

    <div class="countdown" id="countdown">

        <div class="time-box">
            <span id="days">00</span>
            <small>Days</small>
        </div>

        <div class="time-box">
            <span id="hours">00</span>
            <small>Hours</small>
        </div>

        <div class="time-box">
            <span id="minutes">00</span>
            <small>Minutes</small>
        </div>

        <div class="time-box">
            <span id="seconds">00</span>
            <small>Seconds</small>
        </div>

    </div>

    <div class="footer">The celebration awaits...</div>

</main>

<script>
const eventDate = new Date("2026-11-29T08:00:00+05:30").getTime();

function updateCountdown() {

    const now = new Date().getTime();
    const distance = eventDate - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    if (distance <= 0) {
        document.getElementById("countdown").innerHTML =
            "<div style='font-family:Cormorant Garamond,serif;font-size:30px;color:#65451e;'>The Celebration Has Begun!</div>";
        return;
    }

    document.getElementById("days").textContent = String(days).padStart(2, "0");
    document.getElementById("hours").textContent = String(hours).padStart(2, "0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
